<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Cadeia do cuidado em urgências</title>
<desc id="desc">Cinco etapas interligadas: reconhecer sinais de risco, avaliar prioridades ABCDE, agir conforme capacidade, reavaliar continuamente e comunicar a transferência e a continuidade do cuidado. A reavaliação retroalimenta as decisões.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#effbfc"/><stop offset="1" stop-color="#f5faf4"/></linearGradient><linearGradient id="bar" x2="1"><stop stop-color="#0a8aa4"/><stop offset="1" stop-color="#338366"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#235f72" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="680" rx="34" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#153d4d">
<text x="75" y="82" font-size="40" font-weight="700">Urgências: uma decisão em circuito</text><text x="76" y="124" fill="#426776" font-size="21">Reconhecimento, ação e reavaliação com responsabilidade compartilhada</text>
</g><path d="M90 175 H1110" stroke="url(#bar)" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">
<g filter="url(#sh)"><rect x="55" y="220" width="200" height="204" rx="22" fill="#fff" stroke="#abdce2"/><rect x="279" y="220" width="200" height="204" rx="22" fill="#fff" stroke="#abdce2"/><rect x="503" y="220" width="200" height="204" rx="22" fill="#fff" stroke="#abdce2"/><rect x="727" y="220" width="200" height="204" rx="22" fill="#fff" stroke="#abdce2"/><rect x="951" y="220" width="200" height="204" rx="22" fill="#fff" stroke="#abdce2"/></g>
<g fill="#087f99" font-size="28" font-weight="700"><text x="155" y="286">01</text><text x="379" y="286">02</text><text x="603" y="286">03</text><text x="827" y="286">04</text><text x="1051" y="286">05</text></g>
<g fill="#173a4a" font-weight="700"><text x="155" y="327">Reconhecer</text><text x="379" y="327">Avaliar</text><text x="603" y="327">Agir</text><text x="827" y="327">Reavaliar</text><text x="1051" y="327">Comunicar</text></g>
<g fill="#526e77" font-size="16"><text x="155" y="361">Sinais de gravidade</text><text x="155" y="383">e risco da cena</text><text x="379" y="361">Prioridades e</text><text x="379" y="383">estrutura ABCDE</text><text x="603" y="361">Capacidade local e</text><text x="603" y="383">suporte apropriado</text><text x="827" y="361">Mudança clínica e</text><text x="827" y="383">efeito observado</text><text x="1051" y="361">Passagem do cuidado</text><text x="1051" y="383">e continuidade</text></g>
</g><g stroke="#318e99" stroke-width="4" stroke-linecap="round" fill="none"><path d="M256 323 h20 l-9 -9 m9 9 l-9 9"/><path d="M480 323 h20 l-9 -9 m9 9 l-9 9"/><path d="M704 323 h20 l-9 -9 m9 9 l-9 9"/><path d="M928 323 h20 l-9 -9 m9 9 l-9 9"/><path d="M826 438 C823 548 587 548 603 444" stroke="#3c8657" stroke-dasharray="12 10"/><path d="M602 444 l-8 16 m8 -16 l9 16" stroke="#3c8657"/></g>
<rect x="168" y="562" width="864" height="64" rx="17" fill="#d8ede7"/><text x="600" y="589" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#295b48" font-weight="700">Reavaliar não é o fim da sequência: é parte contínua da assistência.</text><text x="600" y="613" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#42665b">Diagrama didático · não substitui protocolo institucional nem decisão clínica</text>
</svg>
