<!doctype html>

<html lang="pt-BR" data-slug="higiene-do-sono"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estúdio SVG — Player vetorial</title><style>*{box-sizing:border-box}html{color-scheme:dark;font:15px system-ui,sans-serif}body{margin:0;background:#0b1017;color:#e9f1f6}header{padding:10px 14px;background:#1e2936;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}a{color:#b4e2ff}main{max-width:1400px;margin:auto;padding:12px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}button,select{font:inherit;background:#304254;color:white;border:1px solid #758b9e;padding:7px 10px;border-radius:6px}input[type=range]{accent-color:#e0b766}.screen{height:min(72dvh,780px);border:1px solid #3d4b5b;background:black;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:8px}#stage{height:100%;width:100%;display:flex;align-items:center;justify-content:center}#stage svg{max-width:100%;max-height:100%;height:100%;width:100%}#seek{width:100%}#status{color:#bbcedb}#stageShell:fullscreen{height:100dvh;width:100vw;border:0;border-radius:0}@media(max-width:650px){.screen{height:58dvh}header,main{padding:8px}}</style></head><body>
<header><strong>Estúdio SVG · Player vetorial V3 experimental</strong><a href="../../../#experimentos">Voltar ao portal</a></header>
<main><div class="toolbar"><button id="play">▶ Reproduzir</button><button id="full">⛶ Tela cheia</button><select id="pivotTarget" aria-label="Objeto cujo eixo será ajustado" hidden></select><button id="calibrate" type="button">⊙ Ajustar eixo</button><label><input id="narrate" type="checkbox" checked> Narrar</label><label>Voz <input id="rate" type="range" min="0.8" max="2.0" value="1.40" step="0.05"><output id="rateOut">1.40×</output></label><label>Idioma da voz <select id="lang"><option value="pt-BR">Português (Brasil)</option><option value="en-US">English</option><option value="es-ES">Español</option><option value="fr-FR">Français</option></select></label></div>
<div id="stageShell" class="screen"><div id="stage" aria-label="Apresentação"></div></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição"><div><span id="clock">00:00</span> · <span id="scene"></span></div><p id="status" role="status">Carregando…</p></main>
<script>window.__voiceFiles={};</script><script src="./runtime.js?v=3"></script><script src="./player.js?v=3"></script></body></html>
